<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IndyTopSeal | Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo { font-size: 11px; font-weight: 800; letter-spacing: 0.16em; color: #f5c518; text-transform: uppercase; margin-bottom: 4px; }
    .logo-main { font-size: 32px; font-weight: 900; color: #fff; letter-spacing: 0.06em; margin-bottom: 40px; }
    .badge { display: inline-block; background: #f5c518; color: #111; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 16px; border-radius: 4px; margin-bottom: 28px; }
    h1 { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 900; line-height: 1.1; margin-bottom: 16px; letter-spacing: -0.02em; }
    h1 span { color: #f5c518; }
    p { color: rgba(255,255,255,0.5); font-size: 1rem; line-height: 1.75; max-width: 400px; margin-bottom: 40px; }
    a { display: inline-block; background: #f5c518; color: #111; font-weight: 700; font-size: 15px; padding: 14px 32px; border-radius: 6px; text-decoration: none; }
    a:hover { background: #e6b800; }
  </style>
</head>
<body>
  <div class="logo">INDY</div>
  <div class="logo-main">TOPSEAL</div>
  <div class="badge">Under Maintenance</div>
  <h1>We'll Be Back <span>Soon</span></h1>
  <p>Our website is currently undergoing maintenance. In the meantime, feel free to give us a call.</p>
  <a href="tel:+12012539536">(201) 253-9536</a>
</body>
</html>
